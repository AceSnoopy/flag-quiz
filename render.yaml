services:
  - type: web
    name: flag-quiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flag-quiz-db
          property: connectionString

databases:
  - name: flag-quiz-db
    plan: free
